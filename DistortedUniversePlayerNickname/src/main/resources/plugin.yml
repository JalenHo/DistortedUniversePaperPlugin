name: DistortedUniversePlayerNickname
version: ${version}
main: dev.distorteduniverse.playernickname.DistortedUniversePlayerNicknamePlugin
api-version: '1.21.11'
description: Persistent player nicknames for chat, tab list, and above-head display.
author: hokay
softdepend:
  - DistortedUniversePlayerDisguise
commands:
  dunickname:
    description: Manage player nicknames.
    usage: /dunickname <help|status|set|clear|list|reload|save|get|config|refresh>
    aliases:
      - dunick
    permission: distorteduniverse.playernickname.admin
permissions:
  distorteduniverse.playernickname.admin:
    description: Allows changing player nicknames and nickname plugin settings in game.
    default: op

