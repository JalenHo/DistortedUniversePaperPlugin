name: Prerelease Plugins

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to create or update for the prerelease.
        required: true
        default: v0.9.3
      release_name:
        description: GitHub release title.
        required: true
        default: DistortedUniverse Plugins v0.9.3 for Paper 26.2

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    env:
      MINECRAFT_VERSION: '26.2'
      PAPER_API_VERSION: '26.2.build.53-alpha'
      JAVA_VERSION: '25'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Paper target
        run: |
          set -euo pipefail
          grep -F "extra[\"paperApiVersion\"] = \"${PAPER_API_VERSION}\"" build.gradle.kts
          grep -F "extra[\"javaVersion\"] = ${JAVA_VERSION}" build.gradle.kts
          for plugin_yml in \
            DistortedUniversePlayerEvent/src/main/resources/plugin.yml \
            DistortedUniverseImmortal/src/main/resources/plugin.yml \
            DistortedUniversePlayerDisguise/src/main/resources/plugin.yml \
            DistortedUniverseFakePlayer/src/main/resources/plugin.yml \
            DistortedUniverseTeam/src/main/resources/plugin.yml
          do
            grep -F "api-version: '${MINECRAFT_VERSION}'" "$plugin_yml"
          done

      - name: Build plugin jars
        run: ./gradlew clean build

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distorteduniverse-paper-plugins-${{ env.MINECRAFT_VERSION }}
          path: |
            DistortedUniversePlayerEvent/build/libs/DistortedUniversePlayerEvent-*.jar
            DistortedUniverseImmortal/build/libs/DistortedUniverseImmortal-*.jar
            DistortedUniversePlayerDisguise/build/libs/DistortedUniversePlayerDisguise-*.jar
            DistortedUniverseFakePlayer/build/libs/DistortedUniverseFakePlayer-*.jar
            DistortedUniverseTeam/build/libs/DistortedUniverseTeam-*.jar
          if-no-files-found: error

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          Pre-release builds targeting Minecraft/Paper ${MINECRAFT_VERSION}.

          Requirements:
          - Java ${JAVA_VERSION}
          - Paper ${MINECRAFT_VERSION}
          - ProtocolLib 5.4.0 or newer for DistortedUniversePlayerDisguise and DistortedUniverseFakePlayer

          Assets:
          - DistortedUniversePlayerEvent
          - DistortedUniverseImmortal
          - DistortedUniversePlayerDisguise
          - DistortedUniverseFakePlayer
          - DistortedUniverseTeam
          EOF

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "${TAG_NAME}" \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --target "${GITHUB_SHA}" \
              --prerelease
          fi

          gh release upload "${TAG_NAME}" \
            DistortedUniversePlayerEvent/build/libs/DistortedUniversePlayerEvent-*.jar \
            DistortedUniverseImmortal/build/libs/DistortedUniverseImmortal-*.jar \
            DistortedUniversePlayerDisguise/build/libs/DistortedUniversePlayerDisguise-*.jar \
            DistortedUniverseFakePlayer/build/libs/DistortedUniverseFakePlayer-*.jar \
            DistortedUniverseTeam/build/libs/DistortedUniverseTeam-*.jar \
            --clobber
