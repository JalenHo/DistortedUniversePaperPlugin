name: Build Plugins

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Upload DistortedUniversePlayerEvent jar
        uses: actions/upload-artifact@v4
        with:
          name: DistortedUniversePlayerEvent
          path: DistortedUniversePlayerEvent/build/libs/*.jar
          if-no-files-found: error

      - name: Upload DistortedUniverseImmortal jar
        uses: actions/upload-artifact@v4
        with:
          name: DistortedUniverseImmortal
          path: DistortedUniverseImmortal/build/libs/*.jar
          if-no-files-found: error
