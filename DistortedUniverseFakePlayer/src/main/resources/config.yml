config-version: 3

enabled: true

movement:
  speed: 0.2
  arrival-distance: 1.5
  tick-interval: 2
  wander-radius: 10

behavior:
  invulnerable: true
  knockback-when-invulnerable: true
  gravity: true
  immovable: false

messages:
  use-player-event-settings: true
  join:
    enabled: true
    radius: 64.0
    template: "<yellow><player_name> joined the game</yellow>"
  leave:
    enabled: true
    radius: 64.0
    template: "<yellow><player_name> left the game</yellow>"
  death-leave:
    enabled: true
    radius: 64.0
    template: "<yellow><player_name> left the game</yellow>"
  death:
    enabled: true
    radius: 64.0
    template: "<player_name> died"

skins:
  folder: "skins"
  default: "default"
